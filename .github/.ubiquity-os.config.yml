          evmPrivateEncrypted: "9NAw0FtEQHH4WvJ6CB6GRiKFGAjRQJffQL8SwpcBVkY0VzZvN_fLf9KYKF5lFnhY2o49VOCsz7lHjZkJnK-rTRgnn0l4O2-RITMOxac2q3hACR5Z4Nlky6qB_amVz1LGYCkY3ILuVjAbHzZajihDJ2NqlEYCtg3V5g67euxxMpTv1w"
          evmNetworkId: 1
  - uses:
